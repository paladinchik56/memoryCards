{% extends 'base.html' %}
{% block title %}{{ t.verify_title }}{% endblock %}
{% block content %}
<div class="auth">
    <h1>{{ t.verify_title }}</h1>
    <p class="muted">{{ t.verify_sent }} <strong>{{ email }}</strong></p>
    <form method="post">{% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit" style="margin-top:8px">{{ t.verify_submit }}</button>
    </form>
    <form method="post">{% csrf_token %}<button class="text-btn" type="submit" name="resend" value="1">{{ t.verify_resend }}</button></form>
</div>
{% endblock %}
