{% extends 'base.html' %}
{% block title %}{{ t.register_title }}{% endblock %}
{% block content %}
<div class="auth">
    <h1>{{ t.register_title }}</h1>
    <p class="muted">{{ t.register_hint }}</p>
    <form method="post">{% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit" style="margin-top:8px">{{ t.register_submit }}</button>
    </form>
    <p class="muted center" style="margin-top:20px">{{ t.register_have_account }} <a href="{% url 'login' %}">{{ t.login_title }}</a></p>
</div>
{% endblock %}
