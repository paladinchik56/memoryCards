{% extends 'base.html' %}

{% block title %}Log in{% endblock %}

{% block content %}
    <h1>Log in</h1>
    <p>In the "Username" field, enter your nickname or email.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log in</button>
    </form>
    <p>Don't have an account? <a href="{% url 'register' %}">Sign up</a></p>
{% endblock %}
