{% extends 'base.html' %}
{% block title %}{{ t.login_title }}{% endblock %}
{% block content %}
<div class="auth">
    <h1>{{ t.login_title }}</h1>
    <form method="post">{% csrf_token %}
        <p><label for="id_username">{{ t.login_login }}</label><input type="text" name="username" id="id_username" autofocus autocomplete="username" required value="{{ form.username.value|default_if_none:'' }}"></p>
        <p><label for="id_password">{{ t.login_password }}</label><input type="password" name="password" id="id_password" autocomplete="current-password" required></p>
        {% if form.errors %}<div class="error">{{ t.login_failed }}</div>{% endif %}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn" type="submit" style="margin-top:16px">{{ t.login_submit }}</button>
    </form>
    <p class="muted center" style="margin-top:20px">{{ t.login_no_account }} <a href="{% url 'register' %}">{{ t.login_register }}</a></p>
</div>
{% endblock %}
