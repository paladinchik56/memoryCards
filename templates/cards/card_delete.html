{% extends 'base.html' %}

{% block title %}Delete card{% endblock %}

{% block content %}
    <h1>Delete card?</h1>
    <p><strong>Question:</strong></p>
    <blockquote>{{ card.question }}</blockquote>
    <p><strong>Answer:</strong></p>
    <blockquote>{{ card.answer }}</blockquote>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Delete</button>
    </form>
    <p><a href="{% url 'cards:list' %}">Cancel</a></p>
{% endblock %}
