{% extends 'base.html' %}

{% block title %}Edit card{% endblock %}

{% block content %}
    <h1>Edit card</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>
    <p><a href="{% url 'cards:list' %}">Back to list</a></p>
{% endblock %}
