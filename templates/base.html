<!DOCTYPE html>
{% load static %}
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{% block title %}Cards{% endblock %}</title>
    <script>
        // Appearance: system / light / dark, remembered per browser.
        (function () {
            var a = 'system';
            try { a = localStorage.getItem('appearance') || 'system'; } catch (e) {}
            if (a !== 'system') document.documentElement.setAttribute('data-theme', a);
        })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <link rel="stylesheet" href="{% static 'web/site.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}{% if user.is_authenticated and tab %} has-tabs{% endif %}">
<main class="page">
    {% if messages %}
        <div class="toasts">{% for message in messages %}<div class="toast">{{ message }}</div>{% endfor %}</div>
    {% endif %}
    {% block content %}{% endblock %}
</main>

{% if user.is_authenticated and tab %}
<nav class="tabs">
    <a href="{% url 'web:study' %}" class="tab{% if tab == 'study' %} on{% endif %}">
        <svg viewBox="0 0 24 24"><path d="M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2z"/><path d="M22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/></svg>
        <span>{{ t.tab_study }}</span>
    </a>
    <a href="{% url 'web:library' %}" class="tab{% if tab == 'library' %} on{% endif %}">
        <svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
        <span>{{ t.tab_library }}</span>
    </a>
    <a href="{% url 'web:profile' %}" class="tab{% if tab == 'profile' %} on{% endif %}">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        <span>{{ t.tab_profile }}</span>
    </a>
</nav>
{% endif %}
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script defer src="{% static 'web/app.js' %}"></script>
</body>
</html>
